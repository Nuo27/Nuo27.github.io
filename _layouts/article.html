---
layout: default
---

<div class="article-detail">
  <section class="article-content-section">
    <div class="container">
      <div class="article-back-row">
        <a href="/articles/" class="back-link">
          <i class="fas fa-arrow-left"></i> Back to Articles
        </a>
      </div>

      <header class="article-header">
        <span class="article-eyebrow mono">// ARTICLE</span>
        <h1 class="article-title">{{ page.title }}</h1>
        {% if page.description %}
        <p class="article-lead">{{ page.description }}</p>
        {% endif %}
        {% if page.tags.size > 0 %}
        <div class="article-tags">
          {% for tag in page.tags %}
          <span class="article-tag mono">{{ tag }}</span>
          {% endfor %}
        </div>
        {% endif %}
      </header>

      <div class="markdown-body article-body">
        {{ content }}
      </div>
    </div>
  </section>

  <section class="article-footer-section">
    <div class="container">
      <a href="/articles/" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to Articles
      </a>
    </div>
  </section>
</div>

<style>
  .article-detail { padding-bottom: 4rem; }

  .article-back-row { padding: 1rem 0; }

  .article-header {
    margin: 1rem 0 2.5rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid color-mix(in srgb, var(--phosphor-soft) 26%, transparent);
  }

  .article-eyebrow {
    display: block;
    font-size: 0.65rem;
    color: var(--cyan);
    letter-spacing: 0.2em;
    margin-bottom: 0.6rem;
  }

  .article-title {
    font-family: var(--font-display);
    font-size: clamp(1.9rem, 5.2vw, 2.9rem);
    font-weight: 700;
    margin: 0 0 0.75rem;
    color: var(--ink);
    letter-spacing: -0.032em;
    line-height: 1.1;
  }

  .article-lead {
    font-size: 1.05rem;
    line-height: 1.65;
    color: var(--ink-mut);
    margin: 0 0 1rem;
    max-width: 640px;
  }

  .article-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
  }

  .article-tag {
    font-size: 0.62rem;
    padding: 0.25rem 0.55rem;
    background: color-mix(in srgb, var(--phosphor-soft) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--phosphor-soft) 28%, transparent);
    border-radius: var(--radius-xs);
    color: var(--phosphor-soft);
    letter-spacing: 0.06em;
  }

  .article-body {
    max-width: 760px;
    margin: 0 auto;
  }

  .article-body h2,
  .article-body h3,
  .article-body h4 {
    font-family: var(--font-display);
    margin-top: 2.25rem;
    margin-bottom: 1rem;
    letter-spacing: -0.025em;
    color: var(--ink);
  }

  .article-body h2 { font-size: 1.5rem; }
  .article-body h3 { font-size: 1.2rem; }

  .article-body p {
    line-height: 1.8;
    margin-bottom: 1.2rem;
  }

  .article-body a {
    color: var(--cyan);
    text-decoration: none;
    border-bottom: 1px solid color-mix(in srgb, var(--cyan) 40%, transparent);
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  .article-body a:hover {
    color: var(--phosphor);
    border-bottom-color: var(--phosphor);
  }

  .article-body ul,
  .article-body ol {
    margin-bottom: 1.2rem;
    padding-left: 1.5rem;
  }

  .article-body li {
    margin-bottom: 0.5rem;
    line-height: 1.7;
  }

  .article-body blockquote {
    border-left: 2px solid var(--phosphor-soft);
    padding: 0.5rem 1.25rem;
    margin: 1.5rem 0;
    font-style: italic;
    color: var(--ink-mut);
    background: color-mix(in srgb, var(--phosphor-soft) 5%, transparent);
  }

  .article-body code {
    background: color-mix(in srgb, var(--phosphor-soft) 12%, transparent);
    padding: 0.15em 0.4em;
    border-radius: var(--radius-xs);
    font-size: 0.85em;
    font-family: var(--font-mono);
    color: var(--phosphor-soft);
  }

  .article-body pre {
    background: var(--bg-raised);
    border: 1px solid color-mix(in srgb, var(--ink) 10%, transparent);
    border-radius: var(--radius-xs);
    padding: 1.2rem;
    overflow-x: auto;
    margin: 1.5rem 0;
  }

  .article-body pre code {
    background: none;
    padding: 0;
    color: var(--ink);
  }

  .article-body img {
    max-width: 100%;
    border-radius: var(--radius-xs);
    margin: 1.5rem 0;
    border: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
  }

  .article-footer-section {
    padding: 2rem 0;
    border-top: 1px solid color-mix(in srgb, var(--phosphor-soft) 24%, transparent);
    margin-top: 3rem;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-family: var(--font-mono);
    color: var(--phosphor);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
    transition: gap 0.25s ease, color 0.2s ease;
  }
  .back-link:hover {
    gap: 0.85rem;
    color: var(--cyan);
  }
</style>
