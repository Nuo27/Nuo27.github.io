<!DOCTYPE html>

<!--
  Nuo.Dev - personal portfolio
  Built on Jekyll. Tactical telemetry UI.
-->

<html lang="en" data-theme="dark">

{% include head.html %}

<body class="h-100 d-flex flex-column">

  <!-- smooth-scroll wrapper - navbar + main + footer. assets/js/smooth-scroll.js
       translates this node via translate3d while body.height is rebuilt to match,
       so native scroll stays the source of truth and the wrapper just glides.
       Fixed overlays (CRT, HUD, lightbox, hero-aurora, #backToTop) live as
       siblings on body / documentElement and are NOT transformed. -->
  <div id="smooth-scroll">
    <div class="container mt-4 flex-shrink-0">
      {% include navbar.html %}
    </div>
    <main id="app" class="flex-shrink-0 container">
      {{ content }}
    </main>
    {% include footer.html %}
  </div>

  {% include scripts.html %}

  <!-- Smooth-scroll inertia - loads before the router so the wrapper transform
       is live before any navigation can swap <main>. -->
  <script src="{{ "/assets/js/smooth-scroll.js" | relative_url }}"></script>

  <!-- Soft router (intercepts in-app navigation, keeps the document shell alive) -->
  <script src="{{ "/assets/js/router.js" | relative_url }}"></script>

  <!-- Main JS (vanilla, no jQuery) -->
  <script src="{{ "/assets/js/main.js" | relative_url }}"></script>
</body>

</html>
