{%- assign images = carousel_images | strip | newline_to_br | split: '<br />' -%}

<div class="gallery-carousel">
  <div class="gallery-main">
    {% for image in images %}
      {%- if forloop.first -%}
        <div class="gallery-item active" data-index="{{ forloop.index0 }}">
          <img src="{{ image }}" alt="Gallery image {{ forloop.index }}">
        </div>
      {%- else -%}
        <div class="gallery-item" data-index="{{ forloop.index0 }}">
          <img src="{{ image }}" alt="Gallery image {{ forloop.index }}">
        </div>
      {%- endif -%}
    {% endfor %}

    {% if images.size > 1 %}
    <button class="gallery-nav gallery-prev" aria-label="Previous">
      <i class="fas fa-chevron-left"></i>
    </button>
    <button class="gallery-nav gallery-next" aria-label="Next">
      <i class="fas fa-chevron-right"></i>
    </button>
    {% endif %}
  </div>

  {% if images.size > 1 %}
  <div class="gallery-thumbs">
    {% for image in images %}
      <button class="gallery-thumb {% if forloop.first %}active{% endif %}" data-index="{{ forloop.index0 }}" aria-label="Go to image {{ forloop.index }}">
        <img src="{{ image }}" alt="Thumbnail {{ forloop.index }}">
      </button>
    {% endfor %}
  </div>
  {% endif %}
</div>

<style>
  .gallery-carousel {
    margin: 2rem 0;
  }

  .gallery-main {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    background: rgba(26, 26, 46, 0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 300px;
    max-height: 70vh;
  }

  [data-theme="dark"] .gallery-main {
    background: rgba(22, 33, 62, 0.5);
  }

  .gallery-item {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }

  .gallery-item.active {
    opacity: 1;
    pointer-events: auto;
  }

  .gallery-item img {
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    object-fit: contain;
    border-radius: 8px;
  }

  .gallery-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: rgba(26, 26, 46, 0.6);
    color: #faf8f5;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    z-index: 10;
  }

  [data-theme="dark"] .gallery-nav {
    background: rgba(250, 248, 245, 0.2);
    color: #faf8f5;
  }

  .gallery-nav:hover {
    background: rgba(26, 26, 46, 0.8);
    transform: translateY(-50%) scale(1.1);
  }

  [data-theme="dark"] .gallery-nav:hover {
    background: rgba(250, 248, 245, 0.3);
  }

  .gallery-prev {
    left: 16px;
  }

  .gallery-next {
    right: 16px;
  }

  .gallery-thumbs {
    display: flex;
    gap: 12px;
    margin-top: 16px;
    overflow-x: auto;
    padding: 4px;
  }

  .gallery-thumb {
    flex-shrink: 0;
    width: 80px;
    height: 60px;
    border-radius: 8px;
    border: 2px solid transparent;
    padding: 0;
    cursor: pointer;
    overflow: hidden;
    opacity: 0.6;
    transition: all 0.2s ease;
    background: rgba(26, 26, 46, 0.05);
    position: relative;
  }

  [data-theme="dark"] .gallery-thumb {
    background: rgba(22, 33, 62, 0.5);
  }

  .gallery-thumb:hover {
    opacity: 0.9;
  }

  .gallery-thumb.active {
    opacity: 1;
    border-color: #e76f51;
  }

  [data-theme="dark"] .gallery-thumb.active {
    border-color: #f4a261;
  }

  .gallery-thumb img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
  }

  /* Hide scrollbar but keep functionality */
  .gallery-thumbs::-webkit-scrollbar {
    height: 6px;
  }

  .gallery-thumbs::-webkit-scrollbar-track {
    background: rgba(26, 26, 46, 0.1);
    border-radius: 3px;
  }

  .gallery-thumbs::-webkit-scrollbar-thumb {
    background: rgba(26, 26, 46, 0.3);
    border-radius: 3px;
  }
</style>

<script>
  (function() {
    const carousel = document.querySelector('.gallery-carousel');
    if (!carousel) return;

    const items = carousel.querySelectorAll('.gallery-item');
    const thumbs = carousel.querySelectorAll('.gallery-thumb');
    const prevBtn = carousel.querySelector('.gallery-prev');
    const nextBtn = carousel.querySelector('.gallery-next');
    let currentIndex = 0;

    function showImage(index) {
      items.forEach((item, i) => {
        item.classList.toggle('active', i === index);
      });
      thumbs.forEach((thumb, i) => {
        thumb.classList.toggle('active', i === index);
      });
      currentIndex = index;
    }

    if (prevBtn) {
      prevBtn.addEventListener('click', () => {
        const newIndex = (currentIndex - 1 + items.length) % items.length;
        showImage(newIndex);
      });
    }

    if (nextBtn) {
      nextBtn.addEventListener('click', () => {
        const newIndex = (currentIndex + 1) % items.length;
        showImage(newIndex);
      });
    }

    thumbs.forEach((thumb, index) => {
      thumb.addEventListener('click', () => showImage(index));
    });

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (!carousel.closest(':visible')) return;
      if (e.key === 'ArrowLeft') {
        const newIndex = (currentIndex - 1 + items.length) % items.length;
        showImage(newIndex);
      } else if (e.key === 'ArrowRight') {
        const newIndex = (currentIndex + 1) % items.length;
        showImage(newIndex);
      }
    });
  })();
</script>
