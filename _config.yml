### Site Settings ###
title               : Nuo
description         : >-
                      Gameplay programmer specializing in multiplayer systems across
                      Unity (C#) and Unreal Engine 5 (C++). UTS Game Development graduate, Sydney.
baseurl             : ""
repository          : nuo27/nuo27.github.io
open_new_tab        : false


### Plugins ###
plugins:
  - jemoji


### Navbar Settings ###
nav_exclude:
  - pages/404.html
  - pages/index.md


### Author Info ###
author:
  name              : Nuo Chen
  image             : assets/image/bio-photo.png
  email             : nuoch3n@gmail.com
  github            : nuo27
  linkedin          : nuochen27


### Collections ###
collections:
  projects:
    output: true
    permalink: /portfolio/:name
  articles:
    output: true
    permalink: /articles/:name


### Defaults for collections ###
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "articles"
    values:
      layout: "article"


### Exclude from processing ###
exclude:
  - README.md
  - CONTRIBUTING.md
  - LICENSE
  - "*.log"
