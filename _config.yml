### Site Settings ###
title               : Nuo
description         : >-
                      Gameplay programmer specializing in multiplayer systems across
                      Unity (C#) and Unreal Engine 5 (C++). UTS Game Development graduate, Sydney.
baseurl             : ""
repository          : nuo27/nuo27.github.io
url                 : "https://nuo27.github.io"


### Navbar (rendered by _includes/navbar.html) ###
nav:
  - { label: About, url: /about/ }
  - { label: Portfolio, url: /portfolio/ }
  - { label: Articles, url: /articles/ }


### Author Info ###
author:
  name              : Nuo Chen
  image             : assets/image/bio-photo.png
  location          : Sydney, Australia


### Social Links (rendered by _includes/social.html) ###
social:
  - name            : Email
    icon            : envelope
    url             : "mailto:nuoch3n@gmail.com"
  - name            : GitHub
    icon            : github
    prefix          : fab
    url             : "https://github.com/nuo27"
  - name            : LinkedIn
    icon            : linkedin-in
    prefix          : fab
    url             : "https://www.linkedin.com/in/nuochen27"


### Collections ###
collections:
  projects:
    output: true
    permalink: /portfolio/:name
  articles:
    output: true
    permalink: /articles/:name


### Defaults for collections ###
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "articles"
    values:
      layout: "article"


### Plugins ###
# jekyll-sitemap → /sitemap.xml for search engines
plugins:
  - jekyll-sitemap


### Portfolio visibility (site-wide defaults) ###
# Tags/categories listed here are suppressed on the portfolio grid unless the
# viewer flips the toggler. `hidden_*` collapse cards behind the toggle;
# `dimmed_*` render them de-emphasized (half-hidden). Page front matter
# (pages/projects.html → `portfolio:`) overrides these per-field.
portfolio:
  subtitle: "Game development projects, experiments & builds."
  accent_tag: "Student Work"
  hidden_tags: ["Student Work"]
  hidden_categories: []
  dimmed_tags: []
  dimmed_categories: []
  hidden_label: "student work"   # short noun; shown uppercased in the toggle button
  filter_label: "FILTER"         # the // label over the category chips
  show_label: "SHOW"             # the // label over the reveal-toggle chips


### Exclude from processing ###
exclude:
  - README.md
  - CONTRIBUTING.md
  - LICENSE
  - "*.log"
